# Блок audioguide в карточку сайта — после того, как заявка rolik-na-sait принесёт mp3 (иначе сборка красная: нет файла audioSrc).
den: 02-07
muzei: izobreteniya
audioguide:
  audioSrc: audio-guide-setun-ru.mp3
  lead: 'Голос ведёт по залу «Сетуни»: от обиды на выборах в Академию через десятый день наладки и «слишком дешёвую» машину — к чердаку и «Наставнику». Четыре остановки.'
  stops:
    - title: 'Три знака вместо двух'
    - title: 'Десятый день наладки'
    - title: 'Слишком дешева'
    - title: 'Чердак и «Наставник»'
  transcript:
    - 'Здравствуйте. Мы в зале «Сетуни». Тысяча девятьсот пятьдесят восьмой год, Москва, МГУ. Весь мир считает нулями и единицами, а машина Николая Брусенцова считает тремя знаками: минус один, ноль и плюс один. В Америке задумывались о троичной ЭВМ — построили её только у нас, в МГУ. А началось всё с обиды: машину МГУ не отдали из-за обиды на выборах в Академию — и Брусенцов построил свою.'
    - 'В чужой лаборатории до девяноста процентов ферритов шло в брак — девять из десяти. Брусенцов нашёл схему, где работают все. Первую троичную ЭВМ мира собрали восемь вчерашних выпускников и двенадцать техников. «Сетунь» заработала на десятый день наладки — такого у наладчиков тех лет ещё не бывало.'
    - 'Комиссия министерства доказывала, что машина не работает. Испытания показали девяносто восемь процентов полезного времени — почти все двадцать четыре часа суток. Пятьдесят «Сетуней» работали от Якутска до Ашхабада — без сервиса и почти без запчастей. Чехословакия собиралась выпускать «Сетунь» большой серией — наши чиновники не дали. А завод снял «Сетунь» с выпуска: за двадцать семь с половиной тысяч рублей она была «слишком дешева».'
    - 'Лабораторию выгнали на чердак без дневного света: «ЭВМ — не дело университета». Семнадцать лет без ремонта — а исправную машину разрезали на куски и выбросили на свалку. На чердаке из спасённой «Сетуни-семьдесят» сделали «Наставник»: студенты осваивали с ним Фортран за десять–пятнадцать часов и знали его лучше, чем после семестра. На ВМК им пользовались больше тридцати лет. А в США на лекциях о советских ЭВМ спрашивали почему-то только о Брусенцове и «Сетуни». Ниже — игра, викторина и источники. Спасибо, что были с нами.'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
