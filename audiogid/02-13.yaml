audioguide:
  audioSrc: audio-guide-beriev-ru.mp3
  durationLabel: 1 минута 50 секунд
  lead: 'Голос ведёт по залу летающих лодок Бериева: от рекорда Бе-10 через «Альбатрос» и Бе-200 — к охотнику за подлодками и «амбарчику» войны. Пять остановок.'
  stops:
  - t: 0
    mark: 0:00
    title: Рекорд Бе-10
  - t: 22
    mark: 0:22
    title: Две машины — сто сорок восемь рекордов
  - t: 44
    mark: 0:44
    title: Двенадцать тонн за двенадцать секунд
  - t: 66
    mark: '1:06'
    title: Охотник за подлодками
  - t: 88
    mark: '1:28'
    title: «Амбарчик» на войне
  transcript:
  - Здравствуйте. Мы в зале летающих лодок Георгия Бериева. Таганрог, конструкторское бюро у самого моря. В тысяча девятьсот шестьдесят первом году реактивную лодку Бе-10 разогнали до девятисот двенадцати километров в час. Этот рекорд летающих лодок не побит до сих пор.
  - Следующая машина — амфибия А-40 «Альбатрос». Построили всего две машины, а мировых рекордов на них поставили сто сорок восемь. На авиасалоне в Ле-Бурже в тысяча девятьсот девяносто первом году её прозвали «Мисс Париж», и на борт поднялся сам президент Франции.
  - Теперь пожарный Бе-200. Он скользит по морю и на ходу набирает двенадцать тонн воды за двенадцать секунд. На Западе его прозвали «русским зверем». В Греции сомневались в русском самолёте, а он сделал восемнадцать сбросов за два часа.
  - Дальше — противолодочная амфибия Бе-12. За один тысяча девятьсот восемьдесят девятый год её экипажи нашли двадцать девять чужих подводных лодок. На снимке рядом Бе-12 идёт низко над всплывшей атомной подлодкой.
  - И последняя остановка — война. Летающая лодка МБР-2, которую звали «амбарчиком», в тысяча девятьсот сорок четвёртом году вывезла из болот англичан, сбитых после удара по линкору «Тирпиц». Спасибо, что прошли зал с нами.
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
