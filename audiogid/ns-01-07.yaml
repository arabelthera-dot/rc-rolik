den: ns-01-07
audioguide:
  audioSrc: audio-guide-gastello-ru.mp3
  lead: "Голос ведёт от аэродрома под Минском до гастелловцев: пять остановок. Слушать можно фоном, пока читаешь историю ниже."
  stops:
    - title: Аэродром
    - title: Звено
    - title: Таран
    - title: Экипаж
    - title: Гастелловцы
  transcript:
    - "<p>Двадцать четвёртое июня сорок первого года, третий день войны. Немецкий «Юнкерс» на бреющем полёте обстреливает стоянку бомбардировщиков. Капитан Николай Гастелло не поднимается в воздух — он бьёт по врагу с земли из крупнокалиберного пулемёта. «Юнкерс» с выбитым правым мотором садится на вынужденную, немецкий лётчик попадает в плен.</p>"
    - "<p>В тот же день из восемнадцати самолётов полка вернулись восемь. Наутро полк снова летит бомбить колонны врага. Звено Гастелло уничтожает и повреждает двадцать танков и бронемашин. Родители когда-то просили его оставить восьмую пулю себе, если подобьют над вражеской землёй. Он отвечал: «Я другой выход найду».</p>"
    - "<p>Двадцать шестое июня. Над дорогой Молодечно — Радошковичи зенитный снаряд пробивает топливный бак, бомбардировщик горит. Внизу — колонна седьмой танковой дивизии вермахта. Гастелло разворачивает горящую машину на колонну врага. Самолёт стал последним снарядом экипажа. Таран видели лётчики Воробьёв и Рыбас.</p>"
    - "<p>Никто из четверых не выпрыгнул: Николай Гастелло, Анатолий Бурденюк, Григорий Скоробогатый, Алексей Калинин. Скоробогатый сам напросился в полёт вместо штатного стрелка. Калинина отозвали из отпуска — приказ догнал его в Архангельске. У деревень Мацки и Мерковичи экипаж унёс двадцать девять солдат врага, больше сотни ранил. Местные жители тайком от оккупантов похоронили лётчиков.</p>"
    - "<p>О таране страна узнала из сводки Совинформбюро ещё до указа о Герое. Однополчанин Гастелло по Халхин-Голу Михаил Ююкин первым направил горящий самолёт на врага. За войну наши лётчики совершили пятьсот шесть наземных огненных таранов. Их называли гастелловцами. Русские не сдаются.</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
