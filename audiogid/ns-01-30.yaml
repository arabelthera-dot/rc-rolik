# Аудиогид «Русские не сдаются», 30 января — ликвидаторы Чернобыля (r560). Текст — по утверждённой карточке ns-01-30 (факты 2, 10, 1, 14, 4, 11, 3, 6, 7, 8, 15).
# Озвучка: gh workflow run audiogid.yml -R arabelthera-dot/rc-rolik -f put=audiogid/ns-01-30.yaml
# На сайт гид кладёт машина rc-site scripts/ns-konveyer.mjs (шаг 0): mp3 из артефакта audiogid-ns-01-30, остановки — по началу абзацев.
den: ns-01-30
audioguide:
  audioSrc: audio-guide-chernobyl-ru.mp3
  lead: "Голос ведёт от ночного пожара на четвёртом блоке через затопленный коридор под реактором, небо над ним и крышу третьего блока — к «Укрытию»: пять остановок."
  stops:
    - title: Пожар
    - title: Под реактором
    - title: Небо над реактором
    - title: Крыша
    - title: Укрытие
  transcript:
    - "<p>Ночью двадцать шестого апреля тысяча девятьсот восемьдесят шестого года, через четыре минуты после взрывов, к станции прибывает караул лейтенанта Владимира Правика. Следом подходит караул Виктора Кибенка из Припяти. На кровле машинного зала, на высоте больше семидесяти метров, среди плавящегося битума и раскалённого графита, они не пускают огонь с четвёртого блока на третий. Обоим по двадцать три года, оба умирают от острой лучевой болезни. Майор Леонид Телятников сам руководит тушением и сам тушит; к шести тридцати пяти утра основные очаги ликвидированы.</p>"
    - "<p>Комиссия боится, что расплав из реактора дойдёт до воды под четвёртым блоком. Нужно открыть задвижки в тоннеле под станцией. Алексей Ананенко, Беспалов и Баранов идут по затопленному коридору — вода по щиколотку, вместо гидрокостюмов обычные респираторы и два дозиметра. Задвижки открыты, вода ушла. После этого все трое продолжают работать на станции.</p>"
    - "<p>Вертолётчики бросают на реактор мешки с песком. Радиация над ним втрое выше расчётной, приборы мерят только до пятисот рентген. Генерал Николай Антошкин придумывает грузить песок в тормозные парашюты на внешней подвеске и доводит сброс до полутора тысяч тонн в день.</p>"
    - "<p>На крыше третьего блока лежат осколки графита из взорвавшегося реактора. Электроника роботов там отказывает — и идут люди: забежать, захватить графит лопатой, сбросить вниз. Генерал Николай Тараканов требует снять свинцовые листы из комнаты правительственной комиссии и режет из них «рубашки» солдатам. Его солдаты снимают с крыш станции триста тонн ядерного горючего, графита и обломков.</p>"
    - "<p>Строители управления строительства шестьсот пять за двести шесть дней и ночей накрывают взорванный реактор «Укрытием». С тысяча девятьсот восемьдесят шестого по тысяча девятьсот девяносто второй год через Чернобыль проходят больше шестисот тысяч ликвидаторов, из них триста сорок тысяч военных.</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
