# Аудиогид «Русские не сдаются», 17 января — Алексей Маресьев (r544). Текст — по утверждённой карточке ns-01-17 (Р549: пятая остановка — победа над Курской дугой вместо разбора мифов).
# Озвучка: gh workflow run audiogid.yml -R arabelthera-dot/rc-rolik -f put=audiogid/ns-01-17.yaml
# На сайт гид кладёт машина rc-site scripts/ns-konveyer.mjs (шаг 0): mp3 из артефакта audiogid-ns-01-17, остановки — по началу абзацев.
den: ns-01-17
audioguide:
  audioSrc: audio-guide-maresyev-ru.mp3
  lead: "Голос ведёт от падения в лес под Новгородом через 18 суток ползком, ампутацию обеих ног и протезы — к первой победе в небе 1943 года: пять остановок."
  stops:
    - title: Падение
    - title: Госпиталь
    - title: Снова в небе
    - title: Победа на протезах
    - title: Курская дуга
  transcript:
    - "<p>Четвёртого апреля тысяча девятьсот сорок второго года в воздушном бою у Демянского плацдарма самолёт младшего лейтенанта Алексея Маресьева подбивают, и он падает в лес. Обе стопы раздроблены. Идти он не может — и восемнадцать суток ползёт к своим через лес и болота без еды.</p>"
    - "<p>В московском госпитале развивается гангрена. Двадцать второго июля тысяча девятьсот сорок второго года профессор Теребинский проводит операцию: ампутацию обеих голеней.</p>"
    - "<p>На протезах Маресьев заново учится ходить, потом летать. Врачебная комиссия даёт заключение: годен на все истребители. В июне тысяча девятьсот сорок третьего года он возвращается в свой полк.</p>"
    - "<p>Девятнадцатого июля тысяча девятьсот сорок третьего года — первая подтверждённая победа на протезах. За войну — десять сбитых самолётов, три до ранения и семь после. Двадцать четвёртого августа тысяча девятьсот сорок третьего года ему присваивают звание Героя Советского Союза.</p>"
    - "<p>Двадцатого июля тысяча девятьсот сорок третьего года, над Курской дугой, Маресьев в бою с превосходящими силами врага сбивает два «Фокке-Вульфа» и спасает двух советских лётчиков. В этом бою наши сбивают тринадцать вражеских самолётов. Командир полка пишет в представлении к Герою: «Не жалея жизни и крови, сражается против врагов».</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
