# Аудиогид «Русские не сдаются», 1 февраля — Александр Пересвет (r681). Текст — по утверждённой карточке ns-02-01 (Р682; факты 13, 10, 9, 1, 2, 11, 3, 8, 12, 7, 4, 6, 5).
# Озвучка: gh workflow run audiogid.yml -R arabelthera-dot/rc-rolik -f put=audiogid/ns-02-01.yaml
# На сайт гид кладёт машина rc-site scripts/ns-konveyer.mjs (шаг 0): mp3 из артефакта audiogid-ns-02-01, остановки — по началу абзацев.
den: ns-02-01
audioguide:
  audioSrc: audio-guide-peresvet-ru.mp3
  lead: "Голос ведёт от кельи игумена Сергия через поединок с богатырём и удар Засадного полка — к бегству Мамая: пять остановок."
  stops:
    - title: Два монаха
    - title: Поединок
    - title: Битва
    - title: Князь под берёзой
    - title: Конец Мамая
  transcript:
    - "<p>Перед походом великий князь Дмитрий Иванович просит у игумена Сергия: «Дай мне, отче, двух воинов из своей братии — Пересвета Александра и брата его Андрея Ослябу». Старец велит обоим собраться и идти с великим князем. Пересвет говорит князю: «Лучше нам убитым быть, нежели в плен попасть».</p>"
    - "<p>Тысяча триста восьмидесятый год, Куликово поле. Против русских выходит ордынский богатырь — «пяти сажен высота его и трёх сажен ширина его». Вызов никто не приказывал: монах Александр Пересвет сам выступает из рядов — «Этот человек ищет подобного себе, я хочу с ним переведаться!» На нём нет доспеха, только схима, по велению игумена Сергия. Они ударяются копьями так, что едва не проламывается земля, и оба падают с коней мёртвыми. Музей-заповедник «Куликово поле»: битва началась с поединка Челубея с Александром Пересветом.</p>"
    - "<p>Бояре просят князя не биться первым. Он отвечает: «Если умру — с вами, если спасусь — с вами!» Свою одежду, коня и багряное знамя он отдаёт боярину Михаилу Бренку — и под тем знаменем Бренка убивают вместо великого князя. У Мамая от пятнадцати до тридцати тысяч воинов, у русских — от десяти до пятнадцати. Передовой полк ложится почти весь, но ломает удар Мамаевой конницы. Битву почти проиграли — и тогда из Зелёной дубравы ударяет Засадный полк. Среди ордынцев паника, войска Мамая бегут. Сражение длится три часа.</p>"
    - "<p>После боя князя ищут среди мёртвых. Фёдор Сабур и Григорий Холопищев находят его живым — избитого, израненного, в тени срубленной берёзы.</p>"
    - "<p>Литовская рать Ягайла опаздывает на день и поворачивает назад, даже не увидев русских. Мамай бежит с золотом и серебром в Кафу, нынешнюю Феодосию, и кафинцы, посовещавшись, убивают его. «И так настал конец Мамаю».</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
