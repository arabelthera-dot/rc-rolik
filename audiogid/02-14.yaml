audioguide:
  audioSrc: audio-guide-monorels-ru.mp3
  durationLabel: 1 минута 50 секунд
  lead: 'Голос ведёт по залу дорог на одном рельсе: от бруса Эльманова через гирокар Шиловского и аэропоезд Вальднера — к лесному монорельсу и поездам будущего. Пять остановок.'
  stops:
  - t: 0
    mark: 0:00
    title: Дорога Эльманова
  - t: 22
    mark: 0:22
    title: Машина, которая не падает
  - t: 44
    mark: 0:44
    title: Аэропоезд
  - t: 66
    mark: '1:06'
    title: Монорельс в тайге
  - t: 88
    mark: '1:28'
    title: Поезда будущего
  transcript:
  - Здравствуйте. Мы в зале дорог на одном рельсе. Крепостной мастер Эльманов пустил вагонетки по одному брусу на столбах за полвека до английских патентов. Его повозка — три яруса и двадцать один метр длины, и всё на одном брусе. В тысяча восемьсот тридцать пятом году посчитали, что на такой дороге одна лошадь тянет за шестнадцать.
  - Следующая остановка — гироскоп. В тысяча девятьсот четырнадцатом году в Лондоне двухколёсная машина Шиловского весом две и семь десятых тонны стояла и не падала. Бреннан, строивший гиропоезд в Англии, прокатился у Шиловского и признал, что сам не додумался.
  - Теперь аэропоезд. Его придумал музыкант-самоучка Вальднер, и модель неслась в парке Горького со скоростью сто двадцать километров в час. На картине Лабаса этот вагон летит над набережной на тонких опорах.
  - Дальше — работа. В тысяча девятьсот тридцать четвёртом году в нижегородской тайге пустили монорельс длиной пятьдесят километров, и он возил лес пятнадцать лет.
  - И последняя остановка — мечты. Романов обещал поезд из Петербурга в Москву на двести километров в час, Вайнберг в Томске возил вагончик на магнитах, а Циолковский придумал поезд без колёс на семьсот двадцать километров в час. Спасибо, что прошли зал с нами.
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
