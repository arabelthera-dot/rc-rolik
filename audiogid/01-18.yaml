zamechanie: 'текст аудиогида r466: без иностранцев (Р298, Р320), главная мысль по h1 (Р365), факты 10+5'
transcript:
- '<p>«Здравствуйте. Мы в зале арифмометра Однера. Посмотрите на обложку: арифмометр «Оригинал-Однер» на дубовой доске. Чёрный корпус с золотыми цифрами, ряд рычажков, каретка со счётчиком и ручка справа, а на доске латунная табличка петербургского торгового дома. Эту машину сделали в Петербурге в тысяча девятьсот десятом — двенадцатом годах, хранится она в Политехническом музее. Под заголовком — Вильгодт Однер, механик, Петербург. Главная мысль зала: Однер первым в мире наладил серийный выпуск арифмометра с колесом выдвижных зубцов, а в Советском Союзе его потомка звали «Феликс». Под обложкой полоса из четырёх чисел. Тысяча восемьсот восемьдесят пятый — мастерская с одним ножным станком. Больше ста станков — через четыре года. Пятьсот арифмометров продано в тысяча восемьсот девяностом. И в том же году — патент и книга-наставление. Пройдём по залу по порядку.»</p>'
- <p>«Начнём с истории. Счётные машины до Однера были тяжёлыми — внутри длинный валик с зубцами разной длины, а весила такая машина больше десяти килограммов. Около тысяча восемьсот семьдесят первого года Однеру принесли починить сломанный арифмометр. Он разобрал его и поставил вместо валика колесо с девятью выдвижными зубцами. Набираешь рычажком цифру — и из колеса выдвигается ровно столько зубцов. Один оборот ручки — и число перешло в счётчик. Колесо Однера — плоский диск, и такие диски ставятся рядом тесной стопкой. Так счётная машина впервые уместилась на столе счетовода. В тысяча восемьсот девяностом году петербургский завод продал первые пятьсот арифмометров. А потом машины по его принципу по всему миру делали миллионами.»</p>
- '<p>«Найдите ниже полку арифмометров: семь машин из четырёх стран. Петербургский «Однер» тысяча восемьсот девяностого года, машины по его образцу из других стран и курский «Феликс». Корпуса у всех разные. Ведите пальцем светящийся просвет по полке или нажмите на машину — и увидите, что у неё внутри. Счётчик под полкой показывает, в скольких машинах из семи колесо Однера уже найдено. А внутри у каждой то же петербургское колесо. Ниже — сравнение кирпичиками. Один кирпичик — пять тысяч машин. Слева один: около пяти тысяч машин старого устройства за сто лет. Справа шестьсот: три миллиона «Феликсов» одного Курска к тысяча девятьсот семьдесят третьему году. Честная оговорка: это схема музея, а не снимок, корпуса нарисованы по типу машин.»</p>'
- '<p>«Теперь игра «Возьми любую и покрути ручку». Задача счетовода: в цехе двадцать три рабочих, каждому положено сто сорок семь рублей. Сколько всего? Нажимайте кнопки «Сотни», «Десятки» и «Единицы» и наберите сто сорок семь. Из колёс выдвинется один, четыре и семь зубцов. Теперь крутите ручку пальцем по кругу по часовой стрелке или нажимайте «Ручку вперёд». Три оборота — в счётчике четыреста сорок один. Нажмите «Сдвинуть каретку»: теперь каждый оборот прибавляет число, умноженное на десять. Ещё два оборота — и в счётчике три тысячи триста восемьдесят один рубль. Всего пять оборотов вместо двадцати трёх сложений. Покрутите назад и уйдите в минус — зазвенит звонок, как у настоящего «Феликса». Честная оговорка: это модель, а не снимок. Три колеса вместо девяти и каретка на два положения.»</p>'
- '<p>«Дальше факты об Однере — десять и ещё пять. Первый арифмометр Однер собрал у себя дома, от бедности, в тысяча восемьсот семьдесят третьем году. Завод из двадцати пяти взрослых и десяти детей взял высшую награду в Чикаго, а в Париже арифмометр получил золото. Каждый пятый ранний арифмометр Однера уехал за границу. В России машина сменила пять имён, последним стал «Феликс», а завод «Феликсов» в Курске заложили на шестой день после Победы. В шестидесятые годы «Феликс» был обязательным уроком в школе, и ученики сами его чинили. И ещё пять фактов: турникеты на пристанях — тоже Однер, номера на деньгах ставила его машина, а ракеты в поле считали на «Феликсе»: ему не нужно электричество.»</p>'
- '<p>«Теперь найдите блок «Что именно Однер сделал первым». Граница первенства такая: арифмометр Однера с колесом, у которого выдвигается нужное число зубцов, — первая в мире машина такого устройства, которую выпускали серийно, в Петербурге с тысяча восемьсот девяностого года. Чего здесь нет: Однер не первым придумал счётную машину вообще. Он сделал её такой, что её можно выпускать сотнями и держать на столе в любой конторе. После национализации завода её делали в Москве, а с конца двадцатых годов — под маркой «Феликс», в честь Дзержинского. И вот во что трудно поверить. В семидесятые годы карманный калькулятор уже был в магазинах, но «Феликс» стоил примерно в десять раз дешевле, и его брали. Делали его до тысяча девятьсот семьдесят восьмого года. Машину с ручкой выпускали дольше, чем существовал Советский Союз.»</p>'
- '<p>«Подведём итог зала. Однер приехал в Петербург осенью тысяча восемьсот шестьдесят восьмого года с восемью рублями, не зная ни слова по-русски. Диплома он так и не получил и говорил о себе: я механик, не инженер. А его колесо разошлось по всему миру и вернулось в Советский Союз «Феликсом». Вывод страницы такой: первым бывает тот, кто сделал сложное простым и дешёвым, — тогда им пользуется весь мир. До карманных калькуляторов бухгалтерии, конторы и школы почти сто лет крутили ручку машины, придуманной в Петербурге. Теперь вернитесь к полке и пройдите просветом все семь машин. Наберите сто сорок семь и умножьте за пять оборотов. Или откройте факты дня и ответьте на пять вопросов викторины. Спасибо, что прошли этот зал вместе со мной.»</p>'
