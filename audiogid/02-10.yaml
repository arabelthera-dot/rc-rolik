transcript:
- 'Здравствуйте. Мы в зале аэросаней. Там, где есть только снег, Россия сделала машину без колёс и гусениц: пропеллер гонит сани по насту быстрее автомобиля. Посмотрите на обложку: «Аэросани уходят в дозор», Ленинград, годы блокады. Снимок хранит Государственный мемориальный музей обороны и блокады Ленинграда.'
- 'Начнём с первенства. Первые в мире аэросани построил русский инженер Неждановский в тысяча девятьсот четвёртом году. А в тысяча девятьсот десятом студент Сикорский разогнал сани до семидесяти четырёх и семи десятых километра в час на моторе в тридцать сил.'
- 'В голодном тысяча девятьсот девятнадцатом году заказ на аэросани ЦАГИ подкрепили пайком: едой платили за машины. Под аэросани за четыре дня создали целую комиссию КОМПАС и дали девять миллионов рублей. Туполев сделал цельнометаллические сани АНТ-III раньше, чем свои металлические самолёты. В тысяча девятьсот двадцать шестом он сам сел за руль своих саней в пробеге Москва — Ленинград — Москва, а в тысяча девятьсот двадцать восьмом его аэросани показали Европе на международной выставке в Берлине.'
- 'Теперь война. Аэросанная рота из четырнадцати пулемётов с ходу разметала двести немецких лыжников. Пленные немцы приняли аэросани за танки, летящие по глубокому снегу. Одни боевые сани тащили за собой на буксире до двух десятков лыжников. Аэросанный батальон за одну ночь прошёл по льду Ладоги в тыл врага и вывез разведчиков с пленными. Под Кронштадтом двое саней ушли под лёд, третьи прорвались с боеприпасами, и орденом Красного Знамени наградили сами аэросани.'
- 'Боевые сани НКЛ-двадцать шесть придумал Наркомлес, а сердце им дал мотор учебного самолёта У-два. За войну собрали семьдесят аэросанных батальонов — две целых одну десятую тысячи машин от Москвы до Сталинграда. Спуститесь к игре «Каждому своё место» и расставьте сани по их первенству.'
