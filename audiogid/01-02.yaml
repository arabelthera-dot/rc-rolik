muzei: iskusstvo
audioguide:
  audioSrc: audio-guide-perov-ru.mp3
  durationLabel: 6 минут 21 секунда
  lead: 'Голос ведёт по залу картины Перова «Тройка»: от сцены с детьми в упряжке через судьбу натурщика Васи и его матери — к символу горького детства. Десять остановок.'
  stops:
  - t: 0
    mark: 0:00
    title: Трое детей вместо тройки
  - t: 41
    mark: 0:41
    title: Обледеневшая бочка
  - t: 71
    mark: 1:11
    title: Фамилия не своя
  - t: 97
    mark: 1:37
    title: «Детская невинность»
  - t: 127
    mark: 2:07
    title: Мать на коленях
  - t: 172
    mark: 2:52
    title: Символ горького детства
  - t: 205
    mark: 3:25
    title: Передвижники и «маленький человек»
  - t: 254
    mark: 4:14
    title: Холод читается кожей
  - t: 294
    mark: 4:54
    title: Только тяжесть
  - t: 340
    mark: 5:40
    title: Итог зала
  transcript:
  - '<p>«Здравствуйте. Мы в зале русской живописи, перед картиной Василия Перова «Тройка». Посмотрите на неё: это не лошади. В упряжку впряжены трое детей, которые втаскивают в гору обледеневшую бочку с водой. И перед этой картиной однажды стояли на коленях, как перед иконой. Под обложкой четыре числа. Тысяча восемьсот шестьдесят шестой — год, когда Перов написал «Тройку». Сто двадцать четыре на сто шестьдесят восемь с половиной сантиметров — размер холста, почти в человеческий рост. Три — столько детей впряжено вместо лошадей. И сорок восемь — столько лет прожил художник. Пройдём по залу по порядку.»</p>'
  - '<p>«Начнём с самой сцены. Зимняя Москва. В гору втаскивают обледеневшую бочку с водой, но запряжены в неё не лошади, а трое детей. Центральный мальчик тянет из последних сил, двое рядом надрываются вместе с ним. Мороз, ветер, впереди — длинная монастырская стена. Единственная, кого никто не запряг, — дворняга с оборванной верёвкой на шее: она бежит свободно, обгоняя детей. Запомните эту собаку — о ней мы ещё скажем.»</p>'
  - '<p>«Теперь об авторе. У этого человека даже фамилия не своя. Василий Перов — незаконный сын барона Криденера, поэтому права на отцовскую фамилию он не имел: в документах его записали Васильевым, по крёстному отцу. А прозвище «Перов» дал сельский дьячок, учивший мальчика грамоте, — за красивый почерк. Прозвище прилипло и стало именем, под которым Россию заставили плакать.»</p>'
  - '<p>«Перов долго не находил лица для центрального мальчика. Ему нужна была не просто детская фигура, а, как он сам говорил, «детская невинность». Однажды у Тверской заставы он встретил крестьянку, «тётушку Марью», с двенадцатилетним сыном Васенькой. Они шли на богомолье. Марья долго не отдавала сына позировать: верила, что с писаного человека «чахнет и умирает». Перов уговорил — и на холсте появилось лицо, которое он искал месяцами.»</p>'
  - '<p>«В тысяча восемьсот шестьдесят седьмом году холст купил Павел Третьяков, прямо у автора. Но самая горькая глава в судьбе картины не про владельцев, а про одну посетительницу. Через несколько лет Васенька умер от оспы. Марья продала всё имущество и пришла выкупить картину с сыном, но та уже принадлежала Третьякову. Перов привёл её в галерею. Мать безошибочно нашла полотно и вскрикнула, узнав сына по выбитому зубу: «Батюшка ты мой! Родной ты мой, вот и зубик-то твой выбитый!» — и встала на колени прямо в зале. Через год художник написал для неё отдельный портрет Васи и послал в деревню в золочёной раме. Марья повесила его в углу, под иконами.»</p>'
  - '<p>«Так «Тройка» стала хрестоматийным символом горького детства в русской живописи — картиной, перед которой в буквальном смысле молились. Художник одним абзацем. Василий Григорьевич Перов жил с тысяча восемьсот тридцать четвёртого по тысяча восемьсот восемьдесят второй год. Мастер бытового жанра, один из основателей Товарищества передвижников, автор «Тройки», «Охотников на привале», «Проводов покойника», портретов Достоевского и Островского. Умер в сорок восемь лет.»</p>'
  - '<p>«А теперь то, во что трудно поверить. В тысяча восемьсот семидесятом году Перов встал у истоков Товарищества передвижных художественных выставок и вместе с Крамским и Мясоедовым подписал его первый устав. Идея была дерзкой: возить картины по провинциальным городам и показывать их не столичной публике, а простым людям. Перов первым вывел на холст «маленького человека» — сироту, нищего, крестьянина — и заставил зрителя смотреть ему в глаза. В живописи он сделал то, что Гоголь и Достоевский сделали в литературе: превратил «униженных и оскорблённых» в главных героев. А ещё Перов был писателем и оставил рассказы о судьбах своих натурщиков, среди них «Тётушка Марья» — история мальчика с «Тройки».»</p>'
  - '<p>«Теперь для тех, кто смотрит внимательно. Перов нарочно выстудил палитру: серебристо-серые и перламутровые оттенки снега и неба, ни одного тёплого пятна, кроме лиц. Смотреть на «Тройку» — значит физически чувствовать зиму. Вся сцена поставлена по диагонали снизу вверх, и взгляд сам втаскивает груз вместе с детьми. А единственное свободное существо на холсте — та самая дворняга с оборванной верёвкой: пёс, у которого нет ни хозяина, ни упряжи, свободнее, чем эти трое детей. Присмотритесь к лицам: на них нет ни одного ребёнка — только взрослая усталость на детских чертах.»</p>'
  - '<p>«Поставьте рядом европейские полотна о детском труде, и разница станет очевидной. Англичане и французы чаще писали детский труд как социальную статистику или сентиментальную сценку. Перов сделал другое: убрал дидактику и оставил только тяжесть — бочку, которая не сдвинется, и подъём, которому не видно конца. У него нет ни одной жалостливой детали вроде заплаканных глаз: есть трое детей, которые тянут, как взрослые, и этого достаточно. А ещё раньше, в тысяча восемьсот шестьдесят первом году, его «Сельский крестный ход на Пасхе» так прямо обличил пьяное духовенство, что картину сняли с выставки. Именно с этого скандала страна узнала: живопись умеет спорить.»</p>'
  - '<p>«Вот и весь зал. Итог дня такой: трое детей впряжены в бочку вместо тройки, мать одного из них узнала его по выбитому зубу, а художник, заставивший Россию плакать, носил неродную фамилию — Перов, от дьячка за красивый почерк. Теперь попробуйте сами. В игре «Судьба объекта» расставьте по порядку путь картины — от первой встречи у Тверской заставы до зала Третьяковской галереи. Потом ответьте на четыре вопроса викторины. А напоследок задайте вопрос самому Перову — он ответит и про «Тройку», и про детей, и про то, зачем картине кричать. Спасибо, что прошли этот зал вместе со мной.»</p>'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
