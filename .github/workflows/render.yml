# Сборка роликов на машинах GitHub (Р243, 24.10.2026): наш сервер не нагружается,
# каждый файл — отдельная машина (4 ядра, 16 ГБ), до 20 параллельно; репо открытый — минуты бесплатны.
# Запуск: gh workflow run render.yml -f zadacha="05jan:AB 26jan:A"   (день:варианты, через пробел)
# Озвучка (Р248): при ozvuchka=true голос (scripts/tts.py, словарь udareniya.json + имена из словаря сайта) и звук (scripts/sfx.py)
# синтезируются здесь же — один раз на день, все варианты берут одну и ту же. false — берётся готовая из репо.
# По умолчанию true: проба 05jan B 16x9 (прогон 40085948048) совпала с эталоном — 46,9 с, 11 МБ.
# Слои (Р249): при sloi=true scripts/layers.py режет подлинные кадры из kadry/<день>/ на фон и передний план
# здесь же — один раз на день; false — берутся готовые слои из public/days/<день>/.
# Заставка из 3D-сцены (r521): gh workflow run render.yml -f zastavka3d=r7 (zadacha не нужна) — снимает
# zastavka3d/<имя>/ в Playwright+SwiftShader по ручным часам и кодирует ролики; обычная сборка при этом не идёт.
# Сценарий НС из карточки (Р699): для дней nsДДмес задание scenarij пересобирает days/<день>.json и kadry/<день>/
# scripts/scenarij.mjs из rc-site main — озвучка, слои и сборка берут только его, не копию из репо.
# Отказ scenarij.mjs (нет хука, меньше 40 с) — день красный, старый сценарий не озвучивается.
# Откат: убрать задание scenarij, его needs и шаги download-artifact scenarij-*.
name: render
# имя прогона = задание и ключ сценария: avto.yml по нему видит, что этот сценарий уже собирали (r685)
run-name: render ${{ inputs.zadacha }}${{ inputs.zastavka3d }} ${{ inputs.klyuch }}
on:
  workflow_dispatch:
    inputs:
      zadacha:
        description: "день:варианты через пробел, напр. 05jan:AB 26jan:A (не нужна при zastavka3d)"
        required: false
        default: ""
      format:
        description: "16x9, 9x16 или оба"
        default: "oba"
      ozvuchka:
        description: "синтезировать озвучку в облаке (false — готовая из репо)"
        type: boolean
        default: true
      sloi:
        description: "собрать слои кадров в облаке (false — готовые из репо)"
        type: boolean
        default: true
      zastavka3d:
        description: "заставка из 3D-сцены: папка в zastavka3d/ (напр. r7); пусто — обычная сборка роликов"
        required: false
        default: ""
      klyuch:
        description: "ключ сценария (ставит avto.yml), только для имени прогона"
        required: false
        default: ""
concurrency:
  group: render-${{ github.run_id }}
jobs:
  plan:
    # при заставке plan пропущен — ozvuchka, layers и render пропускаются вслед за ним
    if: inputs.zastavka3d == ''
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      days: ${{ steps.m.outputs.days }}
      ns: ${{ steps.m.outputs.ns }}
    steps:
      - id: m
        env:
          ZADACHA: ${{ inputs.zadacha }}
          FORMAT: ${{ inputs.format }}
        run: |
          if [ -z "${ZADACHA// /}" ]; then echo "::error::пустая zadacha"; exit 1; fi
          fmts="16x9 9x16"; [ "$FORMAT" = "oba" ] || fmts="$FORMAT"
          items=""; days=""; ns=""
          for z in $ZADACHA; do
            d=${z%%:*}; vs=${z#*:}; [ "$vs" = "$z" ] && vs=A
            case "$days" in *"\"$d\""*) ;; *) days="$days\"$d\",";; esac
            # дни НС (nsДДмес) — сценарий пересобирается из карточки сайта (задание scenarij)
            if echo "$d" | grep -Eq '^ns[0-9]{2}[a-z]{3}$'; then
              case "$ns" in *"\"$d\""*) ;; *) ns="$ns\"$d\",";; esac
            fi
            for v in $(echo "$vs" | grep -o .); do for f in $fmts; do
              items="$items{\"day\":\"$d\",\"v\":\"$v\",\"f\":\"$f\"},"
            done; done
          done
          {
            echo "matrix={\"include\":[${items%,}]}"
            echo "days=[${days%,}]"
            echo "ns=[${ns%,}]"
          } >> "$GITHUB_OUTPUT"
  # Сценарий НС — из записи дня rc-site main при каждом прогоне (Р699): карточку поменяли после сборки —
  # ролик всё равно озвучивает её хук. Как в мире: данные ролика — входные props из источника, не копия
  # (https://www.remotion.dev/docs/passing-props). Отказ — красное задание дня, его артефакта нет,
  # и озвучка/слои/сборка этого дня падают на download-artifact, остальные дни идут (как r264).
  scenarij:
    needs: plan
    if: needs.plan.outputs.ns != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        day: ${{ fromJson(needs.plan.outputs.ns) }}
    name: scenarij-${{ matrix.day }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # scenarij.mjs нужен только js-yaml из lock; движок Remotion здесь не ставится (--ignore-scripts)
      - run: npm ci --ignore-scripts
      - env:
          DEN: ${{ matrix.day }}
        run: |
          mes=jan,feb,mar,apr,may,jun,jul,aug,sep,oct,nov,dec
          dd=${DEN:2:2}; m=${DEN:4:3}
          mm=$(echo "$mes" | tr ',' '\n' | grep -nx "$m" | cut -d: -f1)
          [ -n "$mm" ] || { echo "::error::$DEN: не понять месяц «$m»"; exit 1; }
          key=$(printf '%02d-%s' "$mm" "$dd")
          if ! node scripts/scenarij.mjs "$key"; then
            echo "::error::$DEN: сценарий не собран из карточки rc-site main src/content/days/ne-sdayutsya/$key.json (причина — строка ✗ выше); старый сценарий не озвучивается, ролика дня нет"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scenarij-${{ matrix.day }}
          path: |
            days/${{ matrix.day }}.json
            kadry/${{ matrix.day }}/
          if-no-files-found: error
          retention-days: 14
  ozvuchka:
    needs: [plan, scenarij]
    # scenarij пропущен (нет дней НС) — не помеха; упал у одного дня — падает только этот день
    if: >-
      always() && inputs.ozvuchka && needs.plan.result == 'success'
      && needs.scenarij.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 45  # до 10 попыток по ≈5,5 мин на сцену (r264)
    strategy:
      fail-fast: false
      max-parallel: 2  # служба голоса не любит разом много заданий (r260, r264)
      matrix:
        day: ${{ fromJson(needs.plan.outputs.days) }}
    name: ozvuchka-${{ matrix.day }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # имена и названия с ударениями — один словарь сайта для всех роликов (п. 39), штатным checkout
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: arabelthera-dot/rc-site
          path: rc-site-slovar
          sparse-checkout: src/data/spravochniki/udareniya.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - if: contains(needs.plan.outputs.ns, format('"{0}"', matrix.day))
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: scenarij-${{ matrix.day }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # ffmpeg закреплённой версии, один шаг на весь rc-rolik (r544 п.6): apt вис на 20–36 мин (r277, r283)
      - uses: ./.github/actions/ffmpeg
      - run: pip install -q edge-tts==7.3.1 numpy==2.4.6 scipy==1.17.1
      # озвученные сцены (seg*.mp3 + seg*.json с ключом текста) переживают перезапуск: tts.py их не переозвучивает (r264)
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: public/days/${{ matrix.day }}/seg*
          key: tts-${{ matrix.day }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tts-${{ matrix.day }}-
      - run: python scripts/tts.py "${{ matrix.day }}"
      - if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: public/days/${{ matrix.day }}/seg*
          key: tts-${{ matrix.day }}-${{ github.run_id }}-${{ github.run_attempt }}
      - run: python scripts/sfx.py "${{ matrix.day }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ozvuchka-${{ matrix.day }}
          path: |
            public/days/${{ matrix.day }}/seg*.mp3
            public/days/${{ matrix.day }}/voice.mp3
            public/days/${{ matrix.day }}/sfx.wav
            public/days/${{ matrix.day }}/mix.mp3
            public/days/${{ matrix.day }}/timeline.json
            public/days/${{ matrix.day }}/day.json
          retention-days: 14
  layers:
    needs: [plan, scenarij]
    if: >-
      always() && inputs.sloi && needs.plan.result == 'success'
      && needs.scenarij.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        day: ${{ fromJson(needs.plan.outputs.days) }}
    name: layers-${{ matrix.day }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: contains(needs.plan.outputs.ns, format('"{0}"', matrix.day))
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: scenarij-${{ matrix.day }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -q opencv-python-headless==5.0.0.93 numpy==2.4.6
      - run: python scripts/layers.py "${{ matrix.day }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layers-${{ matrix.day }}
          path: |
            public/days/${{ matrix.day }}/*-bg.jpg
            public/days/${{ matrix.day }}/*-fg.png
            public/days/${{ matrix.day }}/images.json
          retention-days: 14
  render:
    needs: [plan, scenarij, ozvuchka, layers]
    # озвучка/слои выключены — шаг пропущен (skipped), берётся готовое из репо.
    # Упали у одного дня — остальные дни собираются: у дня без голоса/слоёв нет артефакта,
    # download-artifact падает, и падает только его сборка (старый голос из репо не берётся) (r264)
    if: >-
      always() && needs.plan.result == 'success'
      && needs.scenarij.result != 'cancelled'
      && needs.ozvuchka.result != 'cancelled' && needs.layers.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: ${{ matrix.day }}-${{ matrix.v }}-${{ matrix.f }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: contains(needs.plan.outputs.ns, format('"{0}"', matrix.day))
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: scenarij-${{ matrix.day }}
      - if: inputs.ozvuchka
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ozvuchka-${{ matrix.day }}
          path: public/days/${{ matrix.day }}
      - if: inputs.sloi
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: layers-${{ matrix.day }}
          path: public/days/${{ matrix.day }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # ffmpeg закреплённой версии, один шаг на весь rc-rolik (r544 п.6): apt вис на 20–36 мин (r277, r283)
      - uses: ./.github/actions/ffmpeg
      - run: npm ci
      - run: node scripts/render.mjs "${{ matrix.day }}" "${{ matrix.v }}" "${{ matrix.f }}"
      # одна проверка формата (r544 п.6, аудит r530 п.65): кадр 16:9/9:16, длительность, звук, размер; брак — красное задание, выпуска нет.
      # Она же пишет <ролик>.sec — длительность для выпуска на сайт; больше ролик никто не перемеряет.
      - run: node scripts/format.mjs out/*.mp4
      # обложка (кадр 1 с) — здесь, где есть ffmpeg: выпуск на сайт её только переименовывает (r538)
      - run: |
          for f in out/*.mp4; do
            ffmpeg -v error -y -ss 1 -i "$f" -frames:v 1 -q:v 3 "${f%.mp4}-poster.jpg"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.day }}-${{ matrix.v }}-${{ matrix.f }}
          path: |
            out/*.mp4
            out/*-poster.jpg
            out/*.sec
          retention-days: 14
  # Выпуск на сайт (r538/r544): общий шаг .github/workflows/vypusk.yml — тот же, что ручной выпуск из готового прогона.
  vypusk:
    needs: [plan, render]
    if: always() && needs.plan.result == 'success' && inputs.format == 'oba'
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        day: ${{ fromJson(needs.plan.outputs.days) }}
    uses: ./.github/workflows/vypusk.yml
    with:
      day: ${{ matrix.day }}
  zastavka3d:
    if: inputs.zastavka3d != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: zastavka3d-${{ inputs.zastavka3d }}
    env:
      SCENA: ${{ inputs.zastavka3d }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          if ! echo "$SCENA" | grep -Eq '^[a-z0-9-]+$' || [ ! -f "zastavka3d/$SCENA/index.html" ]; then
            echo "::error::нет сцены zastavka3d/$SCENA"; exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # ffmpeg закреплённой версии, один шаг на весь rc-rolik (r544 п.6): apt вис на 20–36 мин (r277, r283)
      - uses: ./.github/actions/ffmpeg
      - run: command -v bc || sudo timeout 180 sh -c 'apt-get update -qq && apt-get install -y -qq bc'
      - working-directory: zastavka3d
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: node zastavka3d/snyat.mjs "zastavka3d/$SCENA" 720 900 out/kadry-4x5
      - run: node zastavka3d/snyat.mjs "zastavka3d/$SCENA" 1280 800 out/kadry-16x10
      - run: |
          cd out
          bash ../zastavka3d/kodirovat.sh kadry-4x5 "$SCENA-3d-zastavka-4x5"
          bash ../zastavka3d/kodirovat.sh kadry-16x10 "$SCENA-3d-zastavka-16x10"
          ls -l ./*.mp4 ./*.webm ./*.webp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zastavka3d-${{ inputs.zastavka3d }}
          path: |
            out/*.mp4
            out/*.webm
            out/*.webp
          retention-days: 14
