# Лёгкая проверка заявок (r397, 28.10.2026): без рендера, без озвучки, без секретов — секунды на машине GitHub.
# Нужна, чтобы слияние шло по правилу «все проверки зелёные». Проверяет:
# - workflows — actionlint (бинарник закреплён по sha256 выпуска v1.7.12);
# - общий ffmpeg (.github/actions/ffmpeg) ставится и умеет нужные фильтры;
# - scripts/format.mjs --proba — проверка формата ловит брак на образцах;
# - scripts/*.py — python -m py_compile;
# - все *.json — разбор python json, все *.yml/*.yaml — разбор yq;
# - замок хука (r544 п.5, Р536): days/ns*.json — первая сцена = хук утверждённой карточки rc-site, кадры свои.
name: proverka
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: proverka-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proverka:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          VER: 1.7.12
          SHA: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          f="actionlint_${VER}_linux_amd64.tar.gz"
          curl -fsSL -o "/tmp/$f" "https://github.com/rhysd/actionlint/releases/download/v${VER}/$f"
          echo "$SHA  /tmp/$f" | sha256sum -c -
          tar -xzf "/tmp/$f" -C /tmp actionlint
          /tmp/actionlint -color
      # zizmor и gitleaks (п.502 плана, Р745, 10.11.2026): опасные места процессов и ключи в коммитах.
      # Как в мире — https://docs.zizmor.sh/usage/#use-in-github-actions, https://github.com/gitleaks/gitleaks#docker.
      - name: zizmor — процессы без опасных мест
        run: pipx run zizmor==1.32.0 --offline --min-severity high .github/workflows
      - name: gitleaks — ключей в рабочей копии нет
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --redact --no-banner
      # общий ffmpeg (r544 п.6): ставится, и в нём есть фильтры, которые зовут scripts/sfx.py и audiogid.py
      - uses: ./.github/actions/ffmpeg
      - name: ffmpeg — нужные фильтры
        run: |
          for f in alimiter loudnorm amix apad; do
            ffmpeg -hide_banner -filters | grep -qw "$f" || { echo "::error::в ffmpeg нет фильтра $f"; exit 1; }
          done
      # проверка формата ролика и гида ловит каждый брак на образцах (Р507): квадрат, без звука, длительность, вес
      - name: node scripts/format.mjs --proba
        run: node scripts/format.mjs --proba
      - name: python -m py_compile scripts/*.py
        run: python3 -m py_compile scripts/*.py
      - name: JSON
        run: |
          rc=0
          while IFS= read -r -d '' f; do
            python3 -m json.tool "$f" >/dev/null || { echo "::error file=$f::битый JSON"; rc=1; }
          done < <(git ls-files -z '*.json')
          exit "$rc"
      - name: YAML
        run: |
          rc=0
          while IFS= read -r -d '' f; do
            yq "." "$f" >/dev/null || { echo "::error file=$f::битый YAML"; rc=1; }
          done < <(git ls-files -z '*.yml' '*.yaml')
          exit "$rc"
      - name: замок хука
        run: node scripts/zamok-huk.mjs
