# ВРЕМЕННО (Р312, 28.10.2026): движок озвучки будет заменён на голос Сергея (Р312); новые гиды этим движком на сайт не выпускать.
# edge-tts здесь — временный движок до перехода на собственный голос Сергея.
# Озвучка аудиогида отдельно от роликов (r310, 28.10.2026): локально edge-tts отдаёт NoAudioReceived,
# в облаке работает. Голос, ударения (udareniya.json) и повторы — из scripts/tts.py, render.yml не трогается.
# Только ручной запуск. Выход — артефакт audiogid-<день>: <день>.mp3, <день>.json (длительности абзацев), p*.mp3.
# Каждый абзац — на своей машине: служба душит одну машину после ~минуты звука подряд (прогон 40637307820 — час отказов).
# Текст из этого репо:   gh workflow run audiogid.yml -f put=audiogid/01-20.yaml
# Текст со страницы сайта: gh workflow run audiogid.yml -f vetka_sajta=main -f put=src/content/dni-shablon/izobreteniya/01-17.yaml
name: audiogid
on:
  workflow_dispatch:
    inputs:
      put:
        description: "путь к yaml с transcript (в этом репо или, если задана ветка сайта, в rc-site)"
        required: true
      vetka_sajta:
        description: "ветка rc-site, откуда взять yaml (пусто — файл из этого репо)"
        default: ""
      golos:
        description: "голос edge-tts"
        default: "ru-RU-DmitryNeural"
      temp:
        description: "скорость edge-tts"
        default: "+18%"
concurrency:
  group: audiogid  # прогоны по одному (r260)
  cancel-in-progress: false
env:
  GOLOS: ${{ inputs.golos || 'ru-RU-DmitryNeural' }}
  TEMP: ${{ inputs.temp || '+18%' }}
jobs:
  razbor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      abzacy: ${{ steps.n.outputs.abzacy }}
      den: ${{ steps.vhod.outputs.den }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q edge-tts==7.3.1 pyyaml==6.0.2
      - id: vhod
        env:
          PUT: ${{ inputs.put }}
          VETKA: ${{ inputs.vetka_sajta }}
        run: |
          if [ -n "$VETKA" ]; then
            curl -fsSL --retry 3 -o /tmp/vhod.yaml "https://raw.githubusercontent.com/arabelthera-dot/rc-site/$VETKA/$PUT"
            echo "f=/tmp/vhod.yaml" >> "$GITHUB_OUTPUT"
          else
            test -f "$PUT"
            echo "f=$PUT" >> "$GITHUB_OUTPUT"
          fi
          echo "den=$(basename "$PUT" .yaml)" >> "$GITHUB_OUTPUT"
      - id: n
        run: echo "abzacy=$(python scripts/audiogid.py chislo '${{ steps.vhod.outputs.f }}')" >> "$GITHUB_OUTPUT"
  abzac:
    needs: razbor
    runs-on: ubuntu-latest
    timeout-minutes: 20  # до 10 попыток с растущей паузой ≈ 5,5 мин, как в render.yml (r264)
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        i: ${{ fromJSON(needs.razbor.outputs.abzacy) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q edge-tts==7.3.1 pyyaml==6.0.2
      - id: vhod
        env:
          PUT: ${{ inputs.put }}
          VETKA: ${{ inputs.vetka_sajta }}
        run: |
          if [ -n "$VETKA" ]; then
            curl -fsSL --retry 3 -o /tmp/vhod.yaml "https://raw.githubusercontent.com/arabelthera-dot/rc-site/$VETKA/$PUT"
            echo "f=/tmp/vhod.yaml" >> "$GITHUB_OUTPUT"
          else
            test -f "$PUT"
            echo "f=$PUT" >> "$GITHUB_OUTPUT"
          fi
          echo "den=$(basename "$PUT" .yaml)" >> "$GITHUB_OUTPUT"
      # apt иногда виснет (r277, r283): 3 мин на apt, иначе сборка ffmpeg с GitHub — как в render.yml
      - run: |
          if ! sudo timeout 180 sh -c 'apt-get update -qq && apt-get install -y -qq ffmpeg'; then
            echo "apt завис или упал — беру сборку ffmpeg с GitHub (BtbN/FFmpeg-Builds)"
            curl -fsSL --retry 3 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            sudo tar -xJf /tmp/ff.tar.xz -C /opt && sudo ln -sf /opt/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /opt/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          fi
          ffmpeg -version | head -1
      - run: python scripts/audiogid.py abzac '${{ steps.vhod.outputs.f }}' ${{ matrix.i }} "$GOLOS" "$TEMP" out/audiogid
      - uses: actions/upload-artifact@v4
        with:
          name: abzac-${{ matrix.i }}
          path: out/audiogid/
          retention-days: 1
  skleika:
    needs: [razbor, abzac]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q edge-tts==7.3.1 pyyaml==6.0.2
      - id: vhod
        env:
          PUT: ${{ inputs.put }}
          VETKA: ${{ inputs.vetka_sajta }}
        run: |
          if [ -n "$VETKA" ]; then
            curl -fsSL --retry 3 -o /tmp/vhod.yaml "https://raw.githubusercontent.com/arabelthera-dot/rc-site/$VETKA/$PUT"
            echo "f=/tmp/vhod.yaml" >> "$GITHUB_OUTPUT"
          else
            test -f "$PUT"
            echo "f=$PUT" >> "$GITHUB_OUTPUT"
          fi
          echo "den=$(basename "$PUT" .yaml)" >> "$GITHUB_OUTPUT"
      # apt иногда виснет (r277, r283): 3 мин на apt, иначе сборка ffmpeg с GitHub — как в render.yml
      - run: |
          if ! sudo timeout 180 sh -c 'apt-get update -qq && apt-get install -y -qq ffmpeg'; then
            echo "apt завис или упал — беру сборку ffmpeg с GitHub (BtbN/FFmpeg-Builds)"
            curl -fsSL --retry 3 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            sudo tar -xJf /tmp/ff.tar.xz -C /opt && sudo ln -sf /opt/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /opt/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          fi
          ffmpeg -version | head -1
      - uses: actions/download-artifact@v4
        with:
          pattern: abzac-*
          merge-multiple: true
          path: out/audiogid/
      - run: |
          python scripts/audiogid.py skleika '${{ steps.vhod.outputs.f }}' "$GOLOS" "$TEMP" out/audiogid '${{ needs.razbor.outputs.den }}'
          python -c "import json,glob;d=json.load(open(glob.glob('out/audiogid/*-*.json')[0]));print('## Аудиогид',d['den'],'—',d['total'],'с');[print('-',a['i'],a['start'],'+',a['dur'],'с, слов',a['slov_golos'],'/',a['slov_tekst']) for a in d['abzacy']]" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: audiogid-${{ needs.razbor.outputs.den }}
          path: out/audiogid/
      # Выпуск на сайт (r538, Р524): гид сам приходит на сайт заявкой rc-site rolik-na-sait — как ролик в render.yml.
      # Куда — из самого дня: muzei и audioguide.audioSrc; нет их — выпуска нет. Свой GITHUB_TOKEN, секретов не нужно.
      - env:
          GH_TOKEN: ${{ github.token }}
          F: ${{ steps.vhod.outputs.f }}
          DEN: ${{ needs.razbor.outputs.den }}
        run: |
          cel=$(python -c "import yaml,json,sys;d=yaml.safe_load(open(sys.argv[1]));print(json.dumps({'muzei':d.get('muzei') or '','fajl':(d.get('audioguide') or {}).get('audioSrc') or ''}))" "$F")
          muzei=$(jq -r .muzei <<<"$cel"); fajl=$(jq -r .fajl <<<"$cel")
          if ! grep -Eq '^[a-z0-9-]+$' <<<"$muzei" || ! grep -Eq '^[a-z0-9-]+\.mp3$' <<<"$fajl"; then
            echo "Выпуска на сайт нет: в $DEN нет muzei или audioguide.audioSrc ($cel)." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          mkdir rel && cp "out/audiogid/$DEN.mp3" "rel/$fajl"
          jq -n --arg den "$DEN" --arg run "$GITHUB_RUN_ID" --arg muzei "$muzei" --arg fajl "$fajl" \
            --argjson sec "$(jq .total "out/audiogid/$DEN.json")" --arg golos "$GOLOS" \
            '{vid: "audiogid", den: $den, run: ($run|tonumber), muzei: $muzei, fajl: $fajl, sec: $sec, golos: $golos}' > rel/vypusk.json
          cat rel/vypusk.json
          tag="vypusk-ag-$muzei-$DEN-$GITHUB_RUN_ID"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && { echo "Выпуск $tag уже есть."; exit 0; }
          gh release create "$tag" rel/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "Аудиогид $muzei $DEN → $fajl" \
            --notes "Аудиогид $muzei $DEN, голос $GOLOS, прогон $GITHUB_RUN_ID. На сайт придёт заявкой rc-site rolik-na-sait (r538)."
          echo "Выпуск на сайт: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" | tee -a "$GITHUB_STEP_SUMMARY"
