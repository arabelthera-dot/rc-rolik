# ffmpeg и ffprobe — один общий шаг для всех заданий rc-rolik (r544 п.6, аудит r530 п.60).
# Как в мире: общий composite action (https://docs.github.com/en/actions/sharing-automations/creating-actions/creating-a-composite-action)
# + закреплённая версия: сборка BtbN конца месяца (их хранят годами, не «latest»), сверка sha256, кэш на машине GitHub.
# apt больше не нужен: он вис на 20–36 мин (r277, r283). Новая версия — поменять tag/fajl/sha256 ниже одной заявкой.
# Почему не ffmpeg из Remotion: в его сборке нет фильтра alimiter (scripts/sfx.py), а Python-заданиям node_modules не нужны.
name: ffmpeg
description: ffmpeg и ffprobe закреплённой версии в PATH
runs:
  using: composite
  steps:
    - id: v
      shell: bash
      run: |
        echo "tag=autobuild-2026-10-31-12-59" >> "$GITHUB_OUTPUT"
        echo "fajl=ffmpeg-n8.1.3-27-g8dca1586f4-linux64-gpl-8.1" >> "$GITHUB_OUTPUT"
        echo "sha256=41e9c565594c390622cf968d82fa4135d9e9a11d06c1515644288cbc844e3380" >> "$GITHUB_OUTPUT"
    - id: kesh
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/ffmpeg/${{ steps.v.outputs.fajl }}
        key: ffmpeg-${{ runner.os }}-${{ steps.v.outputs.sha256 }}
    - if: steps.kesh.outputs.cache-hit != 'true'
      shell: bash
      env:
        TAG: ${{ steps.v.outputs.tag }}
        FAJL: ${{ steps.v.outputs.fajl }}
        SHA: ${{ steps.v.outputs.sha256 }}
      run: |
        mkdir -p ~/.cache/ffmpeg
        curl -fsSL --retry 3 -o /tmp/ff.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/$TAG/$FAJL.tar.xz"
        echo "$SHA  /tmp/ff.tar.xz" | sha256sum -c -
        tar -xJf /tmp/ff.tar.xz -C ~/.cache/ffmpeg "$FAJL/bin/ffmpeg" "$FAJL/bin/ffprobe"
        rm /tmp/ff.tar.xz
    - shell: bash
      env:
        FAJL: ${{ steps.v.outputs.fajl }}
      run: |
        echo "$HOME/.cache/ffmpeg/$FAJL/bin" >> "$GITHUB_PATH"
        "$HOME/.cache/ffmpeg/$FAJL/bin/ffmpeg" -version | head -1
